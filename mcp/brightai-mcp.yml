tools:
- name: brightai_overview
  title: BrightAI overview
  description: Who BrightAI is, what the Stateful platform does, canonical platform-scale
    figures, and the live worldwide opportunity numbers from BrightAI's Global Observability
    Database (BGOD). Includes press-facts and investor-thesis sections. Start here.
  parameters: []
  required: []
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
- name: list_industries
  title: Industry list
  description: Every essential-services vertical BrightAI has mapped, each with live
    anonymized aggregates - addressable annual impact (USD/yr), operators profiled,
    and observability problem-family count.
  parameters: []
  required: []
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
- name: get_industry
  title: Industry deep-dive
  description: One vertical in depth - live aggregates plus its top observability problem
    families (names, first-sentence definitions, applicability). Accepts the slug from
    list_industries or a close industry name.
  parameters:
  - name: industry
    type: string
    minLength: 2
    required: true
    description: Slug or name of the vertical, e.g. "water-and-wastewater" or "Oil
      & Gas".
  required:
  - industry
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
- name: list_problem_families
  title: Observability problem catalog
  description: The canonical catalog of observability problem families BrightAI has
    mapped worldwide (the public taxonomy). Optionally filter by industry slug or a
    name substring.
  parameters:
  - name: industry
    type: string
    required: false
    description: Optional vertical slug/name filter.
  - name: search
    type: string
    required: false
    description: Optional substring filter on family name.
  - name: limit
    type: integer
    required: false
    minimum: 1
    maximum: 200
    default_note: default 40
    description: Max rows.
  required: []
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
- name: get_problem_family
  title: Problem deep-dive
  description: The complete public definition of one observability problem family -
    formal definition, anatomy (manifestations / measurement / intervention), typical
    assets, and which verticals it applies to.
  parameters:
  - name: family_id
    type: string
    minLength: 1
    required: true
    description: Family id from list_problem_families.
  required:
  - family_id
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
- name: check_company
  title: Company lookup
  description: Name (or website domain) lookup against BrightAI's Global Observability
    Database. Returns neutral public facts only - whether the company is profiled,
    its industry, HQ, a one-line description, and the names and count of observability
    problem families identified for it. Minor spelling variations are matched automatically;
    a matched_via "close_spelling" flag marks a did-you-mean correction. Deeper detail
    is available only to verified employees of the company itself.
  parameters:
  - name: name
    type: string
    required: false
    description: Company name, e.g. "Osmose Utilities Services". Close spellings are
      okay.
  - name: domain
    type: string
    required: false
    description: Company website domain, e.g. "osmose.com".
  required: []
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false

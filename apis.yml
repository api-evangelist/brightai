apis:
- aid: brightai:public-mcp
  name: BrightAI Public MCP Server
  description: 'A public, read-only Model Context Protocol server (protocol 2025-06-18,
    serverInfo brightai-public 0.1.0) requiring no authentication. Exposes six tools
    over BrightAI''s Global Observability Database — brightai_overview, list_industries,
    get_industry, list_problem_families, get_problem_family and check_company — plus
    five MCP prompts and four markdown corpus resources. Every tool is annotated readOnlyHint
    true, destructiveHint false, idempotentHint true and openWorldHint false.'
  humanURL: https://public.stateful.world/start.md
  baseURL: https://public.stateful.world/mcp
  tags:
  - MCP
  - Agent Tools
  - Infrastructure Data
  tags_raw:
  - Model Context Protocol
  - Agent Tools
  - Infrastructure Data
  properties:
  - type: MCPServer
    url: mcp/brightai-mcp.yml
  - type: ToolCrosswalk
    url: mcp/brightai-tool-crosswalk.yml
- aid: brightai:public-data
  name: BrightAI Public Observatory Data API
  description: 'Two unauthenticated JSON endpoints published in BrightAI''s llms.txt:
    /api/public/industries returns live worldwide aggregates and per-vertical addressable
    annual impact from the Global Observability Database, and /api/public/company-teaser
    performs a fuzzy operator lookup by name or domain. BrightAI publishes no OpenAPI
    description for either endpoint.'
  humanURL: https://public.stateful.world/llms.txt
  baseURL: https://public.stateful.world/api/public
  tags:
  - Open Data
  - Infrastructure Data

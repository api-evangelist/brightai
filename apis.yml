aid: brightai
name: BrightAI
description: 'BrightAI builds Physical AI for essential services — continuous, AI-driven
  awareness of the real-time state of physical infrastructure for operators of water,
  power, energy, transportation and industrial systems. Founded in 2019 by SmartThings
  founder Alex Hawkinson, the company ships a four-layer Stateful platform (Data Acquisition,
  AI Hub, Stateful OS, Foundation Models) combining peel-and-stick sensors (Stateful
  Sticker), autonomous drone and quadruped inspection, a voice-interactive field Stateful
  Wearable, and infrastructure foundation models trained on operational outcomes across
  millions of industrial assets. BrightAI publishes no conventional developer portal
  or OpenAPI, but it does operate a public, no-authentication Model Context Protocol
  server at public.stateful.world/mcp exposing six read-only tools over its Global
  Observability Database, alongside an llms.txt index, agent-addressed markdown briefs,
  and two unauthenticated public JSON endpoints.'
